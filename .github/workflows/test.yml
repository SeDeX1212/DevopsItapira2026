name: Testar Labirinto BFS DFS

on:
  push:
    branches:
      - Labirinto

  pull_request:
    branches:
      - Labirinto

jobs:

  verificar:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1

      - name: Verificar pygame
        run: |
          python -c "import pygame; print('Pygame OK:', pygame.version.ver)"

      - name: Verificar sintaxe
        run: |
          python -m py_compile labirinto_bfs_dfs.py