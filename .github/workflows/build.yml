name: Build Executavel

on:
  push:
    branches:
      - Labirinto

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1
          pip install pyinstaller

      - name: Verificar pygame
        run: |
          python -c "import pygame; print('Pygame OK:', pygame.version.ver)"

      - name: Gerar executavel
        run: |
          pyinstaller --onefile --windowed --hidden-import pygame --name Labirinto_BFS_DFS labirinto_bfs_dfs.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Labirinto-BFS-DFS
          path: dist/Labirinto_BFS_DFS.exe